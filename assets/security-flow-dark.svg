<svg xmlns="http://www.w3.org/2000/svg" viewBox="-491.55 -318 876.05 624.08" width="100%" role="img" aria-labelledby="security-flow-t security-flow-d" style="display:block;height:auto;max-width:100%" stroke-linejoin="round" stroke-linecap="round">
<title id="security-flow-t">The security flow: intercepted on the device, adjudicated at the gateway, isolated in the data plane, governed from the control plane</title><desc id="security-flow-d">A laptop on a platform, the employee device. A path leads through a highlighted gate, the action gateway, to a building, the business systems. A database platform to the front is the data plane, joined to the device by a dashed line for seat-scoped claims. A server platform at the back is the control plane: signed policy comes down to the device, telemetry and audit evidence go back.</desc>
