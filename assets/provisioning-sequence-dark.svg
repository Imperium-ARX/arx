<svg xmlns="http://www.w3.org/2000/svg" viewBox="-535.69 -112 1071.38 535.36" width="100%" role="img" aria-labelledby="provisioning-sequence-t provisioning-sequence-d" style="display:block;height:auto;max-width:100%" stroke-linejoin="round" stroke-linecap="round">
<title id="provisioning-sequence-t">Provisioning: a single-use credential becomes a seat that already knows who you are</title><desc id="provisioning-sequence-d">Four actors on platforms, control plane, employee, ARX appliance and data plane, each with a dashed lifeline. Five numbered arrows run between them: the credential, the install and redeem, the validation, the identity and policy payload, and the seat-scoped session. A closing line says the employee lands in a workspace that already knows who they are.</desc>
