<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B10"/>
      <stop offset="0.55" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#08130F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#4cb782" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4cb782" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cb782" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4cb782" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4cb782" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2733" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- constellation: org nodes feeding the core -->
  <g stroke="#2E4A3E" stroke-width="1">
    <line x1="880" y1="70" x2="985" y2="140"/>
    <line x1="1080" y1="60" x2="985" y2="140"/>
    <line x1="1130" y1="180" x2="985" y2="140"/>
    <line x1="900" y1="240" x2="985" y2="140"/>
    <line x1="1040" y1="265" x2="985" y2="140"/>
  </g>
  <g fill="#0B1118" stroke="#4cb782" stroke-width="1.2">
    <circle cx="880" cy="70" r="5"/>
    <circle cx="1080" cy="60" r="5"/>
    <circle cx="1130" cy="180" r="5"/>
    <circle cx="900" cy="240" r="5"/>
    <circle cx="1040" cy="265" r="5"/>
  </g>
  <circle cx="985" cy="140" r="11" fill="#4cb782" opacity="0.95"/>
  <circle cx="985" cy="140" r="22" fill="none" stroke="#4cb782" stroke-opacity="0.35"/>
  <circle cx="985" cy="140" r="34" fill="none" stroke="#4cb782" stroke-opacity="0.15"/>

  <!-- wordmark -->
  <text x="90" y="158" font-family="Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="14" fill="#F2F6F4">ARX</text>
  <rect x="94" y="184" width="330" height="2" fill="url(#rule)"/>
  <text x="94" y="222" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="4.5" fill="#9FB4AA">THE COMPANY AI OPERATING SYSTEM</text>
  <text x="94" y="256" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#5C7268">BY IMPERIUM · ONTOLOGY-GROUNDED · GOVERNED · DEPLOYED PER COMPANY</text>
</svg>
