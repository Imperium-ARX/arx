ext-anchor="start">pipeline_v2.xlsx</text><text x="-248.07999999999998" y="-63" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start">pipeline_FINAL.xlsx</text><text x="-171.87" y="-31" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start">pipeline_new.xlsx</text><text x="-509.22" y="71.59797974644667" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="middle" letter-spacing="1.4">WHICHEVER RANKED HIGHEST</text><text x="-509.22" y="87.59797974644667" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="middle">fluent, unaccountable, maybe stale</text><text x="-407.98" y="-286" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">THE INDUSTRY DEFAULT</text><text x="-407.98" y="-270" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start">a pile of documents and similarity search</text><line x1="308.31" y1="100" x2="417.19" y2="100" stroke="#f4f1ea" stroke-width="1.08"/><ellipse cx="308.31" cy="100" rx="2.2" ry="2.2" fill="#f4f1ea" stroke="none" stroke-width="1.2"/><text x="427.19" y="99" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f1ea" text-anchor="start">0  Scope resolution</text><text x="427.19" y="115" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="427.19" dy="0">identity and ontology position</tspan><tspan x="427.19" dy="13.65">set the permitted corpus before anything is ranked</tspan></text><line x1="308.31" y1="48" x2="417.19" y2="48" stroke="#f4f1ea" stroke-width="1.08"/><ellipse cx="308.31" cy="48" rx="2.2" ry="2.2" fill="#f4f1ea" stroke="none" stroke-width="1.2"/><text x="427.19" y="47" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f1ea" text-anchor="start">1  Candidate generation</text><text x="427.19" y="63" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="427.19" dy="0">lexical, semantic, structural walk</tspan><tspan x="427.19" dy="13.65">along ontology edges, temporal</tspan></text><line x1="308.31" y1="-4" x2="417.19" y2="-4" stroke="#f4f1ea" stroke-width="1.08"/><ellipse cx="308.31" cy="-4" rx="2.2" ry="2.2" fill="#f4f1ea" stroke="none" stroke-width="1.2"/><text x="427.19" y="-5" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f1ea" text-anchor="start">2  Fusion and filtering</text><text x="427.19" y="11" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="427.19" dy="0">the system marked authoritative</tspan><tspan x="427.19" dy="13.65">beats its stale exports</tspan></text><line x1="308.31" y1="-56" x2="417.19" y2="-56" stroke="#f4f1ea" stroke-width="1.08"/><ellipse cx="308.31" cy="-56" rx="2.2" ry="2.2" fill="#f4f1ea" stroke="none" stroke-width="1.2"/><text x="427.19" y="-57" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f1ea" text-anchor="start">3  Context assembly</text><text x="427.19" y="-41" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="427.19" dy="0">budgeted, deterministic, every</tspan><tspan x="427.19" dy="13.65">fragment labelled with its source</tspan></text><line x1="308.31" y1="-108.8" x2="417.19" y2="-108.8" stroke="#f4f1ea" stroke-width="1.08"/><ellipse cx="308.31" cy="-108.8" rx="2.2" ry="2.2" fill="#f4f1ea" stroke="none" stroke-width="1.2"/><text x="427.19" y="-109.8" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f1ea" text-anchor="start">4  The answer</text><text x="427.19" y="-93.8" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start"><tspan x="427.19" dy="0">the CRM's number, labelled as the CRM's number;</tspan><tspan x="427.19" dy="13.65">reproducible: same seat, same corpus, same grounding</tspan></text><text x="229.42" y="-284" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">ONTOLOGY-GUIDED RETRIEVAL</text><text x="229.42" y="-268" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start">scope resolved first, authority weighted, assembly deterministic</text>
