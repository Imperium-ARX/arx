ed with its source</tspan></text><line x1="308.31" y1="-108.8" x2="417.19" y2="-108.8" stroke="#f4f1ea" stroke-width="1.08"/><ellipse cx="308.31" cy="-108.8" rx="2.2" ry="2.2" fill="#f4f1ea" stroke="none" stroke-width="1.2"/><text x="427.19" y="-109.8" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f1ea" text-anchor="start">The CRM's number, labelled as the CRM's number</text><text x="427.19" y="-93.8" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9fb4aa" text-anchor="start">reproducible: same seat, same corpus, same grounding</text><text x="229.42" y="-284" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#f4f1ea" text-anchor="start" letter-spacing="1.4">ONTOLOGY-GUIDED RETRIEVAL</text><text x="229.42" y="-268" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9fb4aa" text-anchor="start">scope resolved first, authority weighted, assembly deterministic</text>
