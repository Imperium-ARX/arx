 font-weight="500" fill="#15130e" text-anchor="start" letter-spacing="1.4">INTELLIGENCE</text><text x="277.85" y="108.6" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b675e" text-anchor="start">reasoning core, company ontology, multi-stage retrieval, memory</text><line x1="103.92" y1="135.6" x2="267.85" y2="135.6" stroke="#15130e" stroke-width="1.08"/><ellipse cx="103.92" cy="135.6" rx="2.2" ry="2.2" fill="#15130e" stroke="none" stroke-width="1.2"/><text x="277.85" y="134.6" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#15130e" text-anchor="start" letter-spacing="1.4">ACTION</text><text x="277.85" y="150.6" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b675e" text-anchor="start">governed execution, four enforcement layers, provenance receipts</text><line x1="103.92" y1="177.6" x2="267.85" y2="177.6" stroke="#15130e" stroke-width="1.08"/><ellipse cx="103.92" cy="177.6" rx="2.2" ry="2.2" fill="#15130e" stroke="none" stroke-width="1.2"/><text x="277.85" y="176.6" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#15130e" text-anchor="start" letter-spacing="1.4">DATA</text><text x="277.85" y="192.6" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b675e" text-anchor="start">two-tier knowledge fabric, row-level seat isolation, customer-resident</text><text x="-198.14704154959213" y="-90" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="start">policy flows down</text><text x="-230.55612308660184" y="-11.272077938642141" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="end">evidence flows up</text><text x="-394.3246922834953" y="-178" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#15130e" text-anchor="end" letter-spacing="1.4">CONTROL</text><text x="-394.3246922834953" y="-162" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="end"><tspan x="-394.3246922834953" dy="0">operated by Imperium:</tspan><tspan x="-394.3246922834953" dy="14.950000000000001">provisioning, identity,</tspan><tspan x="-394.3246922834953" dy="14.950000000000001">policy, signed updates</tspan></text><text x="-394.3246922834953" y="-90" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#15130e" text-anchor="end"><tspan x="-394.3246922834953" dy="0">customer content never</tspan><tspan x="-394.3246922834953" dy="13.65">transits the control plane</tspan></text>
