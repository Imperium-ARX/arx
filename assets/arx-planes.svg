<svg xmlns="http://www.w3.org/2000/svg" viewBox="-608.32 -292 1306.17 602" width="100%" role="img" aria-labelledby="arx-planes-t arx-planes-d" style="display:block;height:auto;max-width:100%" stroke-linejoin="round" stroke-linecap="round">
<title id="arx-planes-t">ARX platform architecture: four runtime planes and the operator control plane</title><desc id="arx-planes-d">Four large thin planes stacked: experience on top with a laptop and documents on it, then intelligence, action and data. Each plane has a leader to its name and a one-line description. To the left a highlighted server rack on its own platform, the control plane: policy flows down to the stack, evidence flows up, and customer content never transits it.</desc>
