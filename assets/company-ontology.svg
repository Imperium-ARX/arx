<svg xmlns="http://www.w3.org/2000/svg" viewBox="-157.17 -456.02 1176.26 728.16" width="100%" role="img" aria-labelledby="company-ontology-t company-ontology-d" style="display:block;height:auto;max-width:100%" stroke-linejoin="round" stroke-linecap="round">
<title id="company-ontology-t">A company modelled as seven object classes and the relationships between them</title><desc id="company-ontology-d">Seven platforms on an isometric ground: a seat (Head of Operations, accent), an org unit (Operations), an entity (Supplier: Meridian Ltd), a metric (Supplier spend), a system (Accounting), a process (Invoice approval) and an artifact (Supplier checklist). Labelled edges: seat belongs-to org unit, seat responsible-for metric, metric authoritative-in system, org unit connects-to system, org unit manages entity, entity moves-through process, process documented-by artifact.</desc>
