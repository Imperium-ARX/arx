<title id="knowledge-tiers-t">The two-tier knowledge fabric: personal tiers per seat, an append-only company tier</title><desc id="knowledge-tiers-d">Two seats, Head of Sales and Head of Ops, each with a small personal stack of documents beside the desk. Behind them a raised platform holds the highlighted company-tier database. Solid arrows run from each seat to the company tier, labelled explicit promotion; dashed lines run back, labelled read-only distribution.</desc>
