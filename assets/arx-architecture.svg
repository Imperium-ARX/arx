<svg width="1180" height="560" viewBox="0 0 1180 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1180" height="560" fill="#0A0D11"/>

  <text x="70" y="66" font-size="21" font-weight="600" fill="#F4F7F5">ARX platform architecture</text>
  <text x="70" y="92" font-size="13.5" fill="#7C8B83">Four runtime planes and an operator control plane, deployed as one governed appliance per company.</text>

  <!-- runtime planes -->
  <g>
    <rect x="70" y="128" width="740" height="1" fill="#232B32"/>
    <rect x="70" y="128" width="3" height="88" fill="#4cb782"/>
    <text x="94" y="162" font-size="16" font-weight="600" fill="#F4F7F5">Experience</text>
    <text x="94" y="186" font-size="13" fill="#94A39B">Chat-native workspace, documents, command dashboard, managed browser.</text>
    <text x="786" y="162" text-anchor="end" font-size="12" fill="#5F6E66">no developer chrome</text>
  </g>
  <g>
    <rect x="70" y="228" width="740" height="1" fill="#232B32"/>
    <rect x="70" y="228" width="3" height="88" fill="#4cb782"/>
    <text x="94" y="262" font-size="16" font-weight="600" fill="#F4F7F5">Intelligence</text>
    <text x="94" y="286" font-size="13" fill="#94A39B">Frontier reasoning core, company ontology, multi-stage retrieval, institutional memory.</text>
    <text x="786" y="262" text-anchor="end" font-size="12" fill="#5F6E66">grounded, seat-scoped</text>
  </g>
  <g>
    <rect x="70" y="328" width="740" height="1" fill="#232B32"/>
    <rect x="70" y="328" width="3" height="88" fill="#4cb782"/>
    <text x="94" y="362" font-size="16" font-weight="600" fill="#F4F7F5">Action</text>
    <text x="94" y="386" font-size="13" fill="#94A39B">Governed execution against business systems: four enforcement layers, provenance receipts.</text>
    <text x="786" y="362" text-anchor="end" font-size="12" fill="#5F6E66">fail-closed, receipted</text>
  </g>
  <g>
    <rect x="70" y="428" width="740" height="1" fill="#232B32"/>
    <rect x="70" y="428" width="3" height="88" fill="#4cb782"/>
    <text x="94" y="462" font-size="16" font-weight="600" fill="#F4F7F5">Data</text>
    <text x="94" y="486" font-size="13" fill="#94A39B">Two-tier knowledge fabric, row-level seat isolation, append-only shared knowledge.</text>
    <text x="786" y="462" text-anchor="end" font-size="12" fill="#5F6E66">customer-resident</text>
  </g>
  <rect x="70" y="516" width="740" height="1" fill="#232B32"/>

  <!-- control plane rail -->
  <g>
    <rect x="862" y="128" width="1" height="388" fill="#232B32"/>
    <text x="896" y="162" font-size="16" font-weight="600" fill="#F4F7F5">Control</text>
    <text x="896" y="186" font-size="13" fill="#94A39B">Operated by Imperium.</text>
    <text x="896" y="228" font-size="13" fill="#94A39B">Provisioning and identity</text>
    <text x="896" y="254" font-size="13" fill="#94A39B">Capability policy</text>
    <text x="896" y="280" font-size="13" fill="#94A39B">Brand and theme</text>
    <text x="896" y="306" font-size="13" fill="#94A39B">Signed updates</text>
    <text x="896" y="332" font-size="13" fill="#94A39B">Fleet telemetry</text>
    <text x="896" y="358" font-size="13" fill="#94A39B">Audit and oversight</text>
    <text x="896" y="424" font-size="12.5" fill="#5F6E66">Policy flows down.</text>
    <text x="896" y="446" font-size="12.5" fill="#5F6E66">Evidence flows up.</text>
    <text x="896" y="468" font-size="12.5" fill="#5F6E66">Customer content never</text>
    <text x="896" y="490" font-size="12.5" fill="#5F6E66">transits the control plane.</text>
  </g>
</svg>
