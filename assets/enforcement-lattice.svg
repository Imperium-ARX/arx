3.14" dy="14.950000000000001">is never materialised</tspan></text><line x1="179.79" y1="175.8" x2="169.79" y2="408" stroke="#15130e" stroke-width="1.08"/><ellipse cx="179.79" cy="175.8" rx="2.2" ry="2.2" fill="#15130e" stroke="none" stroke-width="1.2"/><text x="169.79" y="430" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#15130e" text-anchor="middle" letter-spacing="1.4">LAYER 2  IN-PROCESS INTERCEPTION</text><text x="169.79" y="446" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle"><tspan x="169.79" dy="0">a pre-execution hook evaluates</tspan><tspan x="169.79" dy="14.950000000000001">every call under every mode</tspan></text><line x1="339.48" y1="174.4" x2="369.48" y2="-148" stroke="#15130e" stroke-width="1.08"/><ellipse cx="339.48" cy="174.4" rx="2.2" ry="2.2" fill="#15130e" stroke="none" stroke-width="1.2"/><text x="369.48" y="-182" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#15130e" text-anchor="middle" letter-spacing="1.4">LAYER 3  GATEWAY ADJUDICATION</text><text x="369.48" y="-166" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle"><tspan x="369.48" dy="0">the server re-derives policy,</tspan><tspan x="369.48" dy="14.950000000000001">client state is never trusted</tspan></text><line x1="436.13" y1="323.8" x2="426.13" y2="478" stroke="#15130e" stroke-width="1.08"/><ellipse cx="436.13" cy="323.8" rx="2.2" ry="2.2" fill="#15130e" stroke="none" stroke-width="1.2"/><text x="426.13" y="500" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#15130e" text-anchor="middle" letter-spacing="1.4">LAYER 4  AUDIT AND PROVENANCE</text><text x="426.13" y="516" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="middle"><tspan x="426.13" dy="0">an immutable audit row and</tspan><tspan x="426.13" dy="14.950000000000001">a signed receipt per call</tspan></text><line x1="534.51" y1="342.2" x2="580.51" y2="306.2" stroke="#15130e" stroke-width="1.08"/><ellipse cx="534.51" cy="342.2" rx="2.2" ry="2.2" fill="#15130e" stroke="none" stroke-width="1.2"/><text x="586.51" y="310.2" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#15130e" text-anchor="start" letter-spacing="1.4">RECEIPT</text><text x="222.565" y="602" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6b675e" text-anchor="middle">provenance receipt returned to the conversation, verbatim</text><text x="-67.96000000000001" y="2" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#15130e" text-anchor="end" letter-spacing="1.4">AGENT</text><text x="-67.96000000000001" y="18" font-family="Switzer, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b675e" text-anchor="end">intended action</text>
