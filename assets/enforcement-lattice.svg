<svg xmlns="http://www.w3.org/2000/svg" viewBox="-214.21 -302.5 928.72 950.5" width="100%" role="img" aria-labelledby="enforcement-lattice-t enforcement-lattice-d" style="display:block;height:auto;max-width:100%" stroke-linejoin="round" stroke-linecap="round">
<title id="enforcement-lattice-t">The enforcement lattice: every external action clears four independent control layers, fail-closed</title><desc id="enforcement-lattice-d">A straight path runs through four gates: capability existence, in-process interception, gateway adjudication, and audit and provenance, the last one highlighted. A figure labelled agent stands at the start; a receipt lies beyond the last gate and a dashed line returns it along the ground to the agent.</desc>
